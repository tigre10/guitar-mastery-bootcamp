<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitar Mastery Bootcamp</title>
<meta name="description" content="An accelerated, retrieval-based guitar training system for theory, fretboard, ear, rhythm, technique and style.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M8 24 L8 8 L20 8 M8 16 L18 16' stroke='%23fff' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700,800&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GUITAR MASTERY BOOTCAMP — DESIGN SYSTEM
   Pure black / white / gray. No color, no gradients.
   Light mode (white surface, black ink) is default per spec.
   Dark mode is a full inversion, toggleable.
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root, [data-theme="light"]{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface-2:#f4f4f4;
  --surface-3:#eaeaea;
  --raised:#ffffff;
  --ink:#0a0a0a;
  --ink-2:#3d3d3d;
  --muted:#6b6b6b;
  --faint:#9c9c9c;
  --line:#0a0a0a;
  --line-soft:#d6d6d6;
  --line-faint:#e6e6e6;
  --inverse-bg:#0a0a0a;
  --inverse-ink:#ffffff;
  --fill:#0a0a0a;
  --fill-ink:#ffffff;
  --shadow: 0 1px 0 rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
  --scrim: rgba(255,255,255,0.86);
}

[data-theme="dark"]{
  --bg:#050505;
  --surface:#0a0a0a;
  --surface-2:#131313;
  --surface-3:#1c1c1c;
  --raised:#111111;
  --ink:#f5f5f5;
  --ink-2:#c9c9c9;
  --muted:#8f8f8f;
  --faint:#5c5c5c;
  --line:#f5f5f5;
  --line-soft:#333333;
  --line-faint:#222222;
  --inverse-bg:#f5f5f5;
  --inverse-ink:#0a0a0a;
  --fill:#f5f5f5;
  --fill-ink:#0a0a0a;
  --shadow: 0 1px 0 rgba(255,255,255,0.05);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
  --scrim: rgba(5,5,5,0.88);
}

:root{
  --font-display:'Switzer','General Sans',-apple-system,sans-serif;
  --font-body:'General Sans','Switzer',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;

  --text-xs: clamp(0.7rem, 0.68rem + 0.1vw, 0.78rem);
  --text-sm: clamp(0.82rem, 0.8rem + 0.15vw, 0.9rem);
  --text-base: clamp(0.95rem, 0.9rem + 0.2vw, 1.02rem);
  --text-lg: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
  --text-xl: clamp(1.4rem, 1.15rem + 1.1vw, 2rem);
  --text-2xl: clamp(1.9rem, 1.4rem + 2vw, 3rem);

  --space-1:0.25rem; --space-2:0.5rem; --space-3:0.75rem; --space-4:1rem;
  --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem;
  --space-12:3rem; --space-16:4rem; --space-20:5rem;

  --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-xl:14px; --radius-full:999px;
  --dur:150ms; --ease:cubic-bezier(.2,.8,.2,1);
  --content-max: 1180px;
}

html{-webkit-text-size-adjust:none;text-size-adjust:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{
  min-height:100dvh;
  font-family:var(--font-body);
  font-size:var(--text-base);
  line-height:1.5;
  color:var(--ink);
  background:var(--bg);
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.01em;line-height:1.1;text-wrap:balance;font-weight:700;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;}
ul,ol{list-style:none;}
svg{display:block;flex-shrink:0;}
::selection{background:var(--ink);color:var(--bg);}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--radius-sm);}
[data-theme="dark"] :focus-visible{outline-color:var(--ink);}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;}
}

/* ---------- layout shell ---------- */
#app{display:flex;flex-direction:column;min-height:100dvh;}

.app-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px) saturate(1.1);}
.topbar{
  display:flex;align-items:center;gap:var(--space-4);
  padding:var(--space-3) var(--space-5);
  border-bottom:1px solid var(--line-faint);
}
.brand{display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-display);font-weight:800;font-size:var(--text-base);letter-spacing:-.01em;white-space:nowrap;}
.brand .logo{width:26px;height:26px;color:var(--ink);}
.brand .brand-sub{display:none;}
@media (min-width:720px){ .brand .brand-sub{display:inline;color:var(--muted);font-weight:500;font-size:var(--text-xs);margin-left:2px;} }

.topbar-stats{display:flex;align-items:center;gap:var(--space-3);margin-left:auto;font-family:var(--font-mono);}
.stat-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-soft);border-radius:var(--radius-full);font-size:var(--text-xs);white-space:nowrap;}
.stat-chip b{font-weight:700;color:var(--ink);}
.stat-chip .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:0.62rem;}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line-soft);border-radius:var(--radius-md);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line);}
.icon-btn svg{width:16px;height:16px;}

.navbar{
  display:flex;gap:2px;overflow-x:auto;
  padding:0 var(--space-5);
  border-bottom:1px solid var(--line-faint);
  scrollbar-width:none;
}
.navbar::-webkit-scrollbar{display:none;}
.nav-btn{
  display:flex;align-items:center;gap:7px;
  padding:var(--space-3) var(--space-3);
  font-size:var(--text-sm);font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color var(--dur) var(--ease);
}
.nav-btn svg{width:15px;height:15px;opacity:.75;}
.nav-btn:hover{color:var(--ink);}
.nav-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
.nav-btn.active svg{opacity:1;}

main{flex:1;width:100%;max-width:var(--content-max);margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-20);}
@media (max-width:640px){ main{padding:var(--space-4) var(--space-4) var(--space-16);} }
@media (max-width:600px){
  .topbar{padding:var(--space-3) var(--space-4);gap:var(--space-2);}
  .topbar-stats{gap:5px;}
  .stat-chip{padding:4px 7px;gap:3px;font-size:0.62rem;}
  .stat-chip .lbl{display:none;}
  .icon-btn{width:30px;height:30px;flex-shrink:0;}
  .brand span{font-size:var(--text-sm);}
  .brand .logo{width:22px;height:22px;}
}
@media (max-width:380px){
  .topbar{gap:6px;}
  .stat-chip{padding:4px 6px;}
}

.view-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-6);}
.view-title{font-size:var(--text-xl);}
.view-sub{color:var(--muted);font-size:var(--text-sm);max-width:60ch;}
.eyebrow{font-family:var(--font-mono);text-transform:uppercase;font-size:0.68rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;display:block;}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--radius-md);
  font-size:var(--text-sm);font-weight:600;letter-spacing:0.01em;
  border:1px solid var(--line);
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease),opacity var(--dur) var(--ease);
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--fill);color:var(--fill-ink);}
.btn-primary:hover{opacity:.85;}
.btn-ghost{background:transparent;color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:7px 13px;font-size:var(--text-xs);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-block{width:100%;}

.card{
  border:1px solid var(--line-soft);
  border-radius:var(--radius-lg);
  background:var(--surface);
  padding:var(--space-5);
}
.card-tight{padding:var(--space-4);}

.grid{display:grid;gap:var(--space-4);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line-soft);border-radius:var(--radius-full);font-size:var(--text-xs);color:var(--muted);font-weight:600;}
.tag.on{border-color:var(--line);color:var(--ink);background:var(--surface-2);}

.progress-track{height:6px;border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden;}
.progress-fill{height:100%;background:var(--fill);border-radius:var(--radius-full);transition:width .25s var(--ease);}

/* module tiles on dashboard */
.mod-tile{
  display:flex;flex-direction:column;gap:var(--space-3);
  padding:var(--space-5);border:1px solid var(--line-soft);border-radius:var(--radius-lg);
  text-align:left;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
  cursor:pointer;position:relative;overflow:hidden;background:var(--surface);
}
.mod-tile:hover{border-color:var(--line);background:var(--surface-2);}
.mod-tile .mod-icon{width:30px;height:30px;}
.mod-tile h3{font-size:var(--text-base);}
.mod-tile p{font-size:var(--text-xs);color:var(--muted);line-height:1.45;}
.mod-tile .mod-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-family:var(--font-mono);font-size:0.68rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;}

/* ---------- drill runner ---------- */
.drill-shell{max-width:720px;margin:0 auto;}
.drill-topline{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-5);font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted);}
.drill-topline .combo{font-weight:700;color:var(--ink);}
.drill-card{
  border:1px solid var(--line);border-radius:var(--radius-xl);
  padding:var(--space-8) var(--space-6);
  min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);
  text-align:center;background:var(--surface);position:relative;
}
.drill-topic{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;font-size:0.66rem;color:var(--muted);position:absolute;top:16px;left:20px;}
.drill-due{position:absolute;top:16px;right:20px;font-size:0.66rem;font-family:var(--font-mono);color:var(--faint);}
.drill-prompt{font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);}
.drill-prompt.mono{font-family:var(--font-mono);}
.drill-hint{color:var(--muted);font-size:var(--text-sm);}

.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3);margin-top:var(--space-5);width:100%;max-width:640px;margin-inline:auto;}
@media (max-width:560px){ .choices{grid-template-columns:1fr;} }
.choice-btn{
  padding:14px 16px;border:1px solid var(--line-soft);border-radius:var(--radius-md);
  font-size:var(--text-sm);font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;
  background:var(--surface);transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
}
.choice-btn .k{font-family:var(--font-mono);font-size:0.68rem;color:var(--faint);border:1px solid var(--line-faint);border-radius:4px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.choice-btn:hover:not(:disabled){border-color:var(--line);}
.choice-btn.correct{background:var(--fill);color:var(--fill-ink);border-color:var(--fill);}
.choice-btn.wrong{border-color:var(--line);text-decoration:line-through;opacity:.55;}
.choice-btn.reveal-correct{border-color:var(--line);border-width:2px;font-weight:800;}
.choice-btn:disabled{cursor:default;}

.type-row{display:flex;gap:var(--space-2);margin-top:var(--space-5);width:100%;max-width:420px;margin-inline:auto;}
.type-input{
  flex:1;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--radius-md);
  background:var(--surface);font-size:var(--text-base);font-family:var(--font-mono);text-align:center;
}
.type-input:focus{border-color:var(--line);}
.type-input.correct{border-color:var(--line);background:var(--surface-2);}
.type-input.wrong{border-color:var(--line);text-decoration:line-through;}

.feedback-banner{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  margin-top:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);
  font-size:var(--text-sm);width:100%;max-width:640px;margin-inline:auto;
}
.feedback-banner.ok{background:var(--fill);color:var(--fill-ink);border-color:var(--fill);}
.feedback-banner b{font-weight:800;}
.feedback-banner .fb-answer{font-family:var(--font-mono);}

.drill-actions{display:flex;justify-content:center;gap:var(--space-3);margin-top:var(--space-6);}

/* fretboard */
.fretboard-wrap{overflow-x:auto;padding-bottom:6px;}
.fretboard{position:relative;display:flex;flex-direction:column;min-width:640px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);}
.fret-row{display:flex;position:relative;}
.fret-cell{
  flex:1;height:44px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-faint);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.fret-cell:first-child{border-right:2px solid var(--line);background:var(--surface-2);flex:0 0 44px;}
.fret-cell:last-child{border-right:none;}
.fret-row:last-child .fret-cell{border-bottom:none;}
.fret-cell .string-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-soft);z-index:0;}
.fret-marker-row{display:flex;}
.fret-marker-cell{flex:1;flex:0 0 44px;}
.fret-num{flex:1;text-align:center;font-family:var(--font-mono);font-size:0.65rem;color:var(--faint);padding:4px 0;}
.fret-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--line-faint);top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;}
.note-dot{
  width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;font-family:var(--font-mono);
  background:var(--surface);z-index:1;cursor:pointer;transition:background var(--dur),color var(--dur);
}
.note-dot.filled{background:var(--fill);color:var(--fill-ink);}
.note-dot.target{border-width:2px;}
.note-dot:hover{background:var(--surface-3);}
.note-dot.hit{background:var(--fill);color:var(--fill-ink);}
.note-dot.miss{border-style:dashed;opacity:.5;}

/* metronome */
.metronome{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);}
.metro-dial{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:var(--text-lg);font-weight:800;position:relative;}
.metro-dial.beat::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--line);animation:pulse .12s var(--ease);}
@keyframes pulse{from{opacity:1;transform:scale(1);}to{opacity:0;transform:scale(1.25);}}
.beat-lights{display:flex;gap:8px;}
.beat-light{width:10px;height:10px;border-radius:50%;border:1px solid var(--line-soft);}
.beat-light.on{background:var(--fill);border-color:var(--fill);}
.beat-light.accent{border-width:2px;}
.bpm-row{display:flex;align-items:center;gap:var(--space-3);}
.bpm-row .bpm-num{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:800;min-width:64px;text-align:center;}
.bpm-btn{width:34px;height:34px;border:1px solid var(--line-soft);border-radius:50%;font-weight:700;display:flex;align-items:center;justify-content:center;}
.bpm-btn:hover{border-color:var(--line);}
.tap-grid{display:flex;gap:4px;flex-wrap:wrap;}
.tap-cell{width:34px;height:34px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-family:var(--font-mono);}
.tap-cell.active{border-color:var(--line);border-width:2px;font-weight:800;}
.tap-cell.hit{background:var(--fill);color:var(--fill-ink);}

/* modal / sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:720px){ .overlay{align-items:center;} }
.sheet{
  background:var(--surface);border:1px solid var(--line);border-top:1px solid var(--line);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  padding:var(--space-6);box-shadow:var(--shadow-lg);
}
@media (min-width:720px){ .sheet{border-radius:var(--radius-xl);max-height:80vh;} }
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);}

table.data-table{width:100%;border-collapse:collapse;font-size:var(--text-sm);}
table.data-table th,table.data-table td{border:1px solid var(--line-faint);padding:8px 10px;text-align:left;}
table.data-table th{background:var(--surface-2);font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}

.stat-block{border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:var(--space-4);}
.stat-block .num{font-family:var(--font-mono);font-size:var(--text-xl);font-weight:800;}
.stat-block .lbl{color:var(--muted);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

.weak-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--line-faint);}
.weak-row:last-child{border-bottom:none;}
.weak-bar{width:100px;height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden;}
.weak-bar span{display:block;height:100%;background:var(--fill);}

.empty{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-16) var(--space-6);text-align:center;color:var(--muted);}

kbd{font-family:var(--font-mono);font-size:0.68rem;border:1px solid var(--line-soft);border-radius:4px;padding:1px 6px;}

.toast-wrap{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--inverse-bg);color:var(--inverse-ink);padding:10px 18px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .2s var(--ease);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.checklist{display:flex;flex-direction:column;gap:2px;}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-faint);border-radius:var(--radius-md);}
.check-row.done{background:var(--surface-2);}
.check-row .cbox{width:18px;height:18px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check-row.done .cbox{background:var(--fill);color:var(--fill-ink);}

.route-fade{animation:routeFade .18s var(--ease);}
@keyframes routeFade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  {id:'blues-call', title:'Blues Call & Answer', body:'A blues phrase states a short idea over bars 1-2, then answers it with a variation over bars 3-4 — usually built from the minor pentatonic with a blue note (b5) bend.', q:'A 12-bar blues phrase that repeats an idea then varies it is called a...', choices:['Call and response','Sequence','Pedal point','Cadenza'], answer:0},
  {id:'jazz-enclosure', title:'Jazz Enclosure', body:'An enclosure surrounds a target chord tone by approaching it from both a half-step above and below before landing on it — a core bebop device.', q:'Approaching a target note from a half-step above then below (or vice versa) before landing on it is called a...', choices:['Enclosure','Sequence','Pedal tone','Turnaround'], answer:0},
  {id:'metal-sequence', title:'Metal Sequential Picking', body:'Metal lead phrases often repeat a short 3-4 note cell and shift it up the scale degree by degree — a "sequence" — combined with strict alternate picking or picked-legato hybrids.', q:'Repeating a short melodic cell and shifting it stepwise through a scale is called a...', choices:['Sequence','Enclosure','Drone','Cadence'], answer:0},
  {id:'country-chicken', title:'Chicken Pickin\' Snap', body:'A hybrid-picking technique (pick + fingers) that snaps a string against the fretboard for a percussive "cluck," common in country and Americana leads.', q:'The percussive string-snap technique common in country lead playing is called...', choices:['Chicken pickin\'','Sweep picking','Tapping','Palm muting'], answer:0},
  {id:'fingerstyle-travis', title:'Travis Picking', body:'An alternating-bass fingerstyle pattern where the thumb keeps a steady bass pulse (often alternating between two bass notes) while the fingers pick out a melody on top.', q:'The fingerstyle pattern with a steady alternating thumb bass under a picked melody is called...', choices:['Travis picking','Sweep picking','Campanella','Rasgueado'], answer:0},

// =====================================================================
// AUDIO ENGINE — Web Audio synthesis (tones, chords, metronome, mic pitch)
// =====================================================================
const Audio_ = (function(){
  let ctx = null;
  function ensure(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playTone(freq, {dur=0.55, type='triangle', gain=0.22, when=0, attack=0.01, release=0.18} = {}){
    const c = ensure();
    const t0 = c.currentTime + when;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+attack);
    g.gain.setValueAtTime(gain, t0+dur-release>t0+attack? t0+dur-release : t0+attack+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
    return t0+dur;
  }

  function playMidi(midi, opts){ return playTone(freqFromMidi(midi), opts); }

  function playChordMidis(midis, {dur=1.1, gain=0.14, when=0, type='triangle'}={}){
    midis.forEach(m=>playMidi(m, {dur, gain, when, type}));
  }

  function playArpeggio(midis, {noteDur=0.32, gap=0.16, gain=0.22, type='triangle'}={}){
    midis.forEach((m,i)=>playMidi(m, {dur:noteDur, gain, when:i*gap, type}));
    return midis.length*gap + noteDur;
  }

  function click(accent=false, when=0){
    const c = ensure();
    const t0 = c.currentTime + when;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = 'square';
    osc.frequency.value = accent? 1500 : 1000;
    g.gain.setValueAtTime(accent?0.28:0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.045);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+0.05);
  }

  function now(){ return ensure().currentTime; }

  // ---- Metronome scheduler (lookahead pattern) ----
  function makeMetronome(){
    let bpm = 80, beatsPerBar = 4, running = false, nextTime = 0, current = 0, timer = null;
    let onBeat = ()=>{};
    const lookahead = 25, scheduleAhead = 0.12;
    function scheduler(){
      const c = ensure();
      while(nextTime < c.currentTime + scheduleAhead){
        const accent = current % beatsPerBar === 0;
        click(accent, nextTime - c.currentTime);
        const cb = onBeat, beatIdx = current % beatsPerBar, t = nextTime;
        setTimeout(()=>cb(beatIdx, t), Math.max(0,(nextTime - c.currentTime)*1000));
        nextTime += 60/bpm;
        current++;
      }
    }
    return {
      start(){ if(running) return; running=true; const c=ensure(); nextTime=c.currentTime+0.05; current=0; timer=setInterval(scheduler, lookahead); },
      stop(){ running=false; if(timer) clearInterval(timer); timer=null; },
      setBpm(v){ bpm = v; },
      getBpm(){ return bpm; },
      setBeatsPerBar(v){ beatsPerBar=v; },
      isRunning(){ return running; },
      set onBeat_(fn){ onBeat = fn; },
      onBeatCb(fn){ onBeat = fn; },
      nowSec(){ return ensure().currentTime; },
    };
  }

  // ---- Simple autocorrelation pitch detector (for sing-and-match) ----
  function autoCorrelate(buf, sampleRate){
    const SIZE = buf.length;
    let rms = 0;
    for(let i=0;i<SIZE;i++){ rms += buf[i]*buf[i]; }
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.01) return -1;
    let r1=0, r2=SIZE-1, thresh=0.2;
    for(let i=0;i<SIZE/2;i++){ if(Math.abs(buf[i])<thresh){ r1=i; break; } }
    for(let i=1;i<SIZE/2;i++){ if(Math.abs(buf[SIZE-i])<thresh){ r2=SIZE-i; break; } }
    const trimmed = buf.slice(r1,r2);
    const n = trimmed.length;
    const c = new Array(n).fill(0);
    for(let i=0;i<n;i++){ for(let j=0;j<n-i;j++){ c[i] += trimmed[j]*trimmed[j+i]; } }
    let d=0; while(c[d]>c[d+1]) d++;
    let maxval=-1, maxpos=-1;
    for(let i=d;i<n;i++){ if(c[i]>maxval){ maxval=c[i]; maxpos=i; } }
    let T0 = maxpos;
    if(T0<=0) return -1;
    const x1=c[T0-1]||0, x2=c[T0]||0, x3=c[T0+1]||0;
    const a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if(a) T0 = T0 - b/(2*a);
    return sampleRate/T0;
  }

  let micStream = null, micCtx = null, micAnalyser = null, micRAF = null;
  async function startMic(onPitch){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      micCtx = ensure();
      const src = micCtx.createMediaStreamSource(micStream);
      micAnalyser = micCtx.createAnalyser();
      micAnalyser.fftSize = 2048;
      src.connect(micAnalyser);
      const buf = new Float32Array(micAnalyser.fftSize);
      function loop(){
        micAnalyser.getFloatTimeDomainData(buf);
        const freq = autoCorrelate(buf, micCtx.sampleRate);
        onPitch(freq);
        micRAF = requestAnimationFrame(loop);
      }
      loop();
      return true;
    }catch(e){
      return false;
    }
  }
  function stopMic(){
    if(micRAF) cancelAnimationFrame(micRAF);
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); }
    micStream = null; micAnalyser = null;
  }

  return { ensure, playTone, playMidi, playChordMidis, playArpeggio, click, now, makeMetronome, startMic, stopMic };
})();
// =====================================================================
// STATE + SPACED REPETITION ENGINE (in-memory only — resets on reload)
// =====================================================================
const State = {
  theme: 'light',
  clock: 0,           // virtual clock, incremented once per answered item (any module)
  xp: 0,
  combo: 0,
  bestCombo: 0,
  totalAttempts: 0,
  totalCorrect: 0,
  totalRt: 0,          // ms, sum
  items: {},           // itemId -> {box, due, attempts, correct, lastRt}
  topics: {},          // topic -> {attempts, correct}
  moduleStats: {},      // module -> {attempts, correct, rt}
  bpmCeilings: {},      // drillId -> bpm
  techBpmCurrent: {},    // drillId -> current bpm in Technique Gym
  earScore: {attempts:0, correct:0},
  checkpoints: {},      // checkpointId -> boolean unlocked
  dailyDaysDone: {},     // planId -> Set of day numbers marked done
  sessionLog: [],       // small ring buffer of recent events for debugging/dashboard
};

const SRS_INTERVALS = [1,3,7,14,28,55,100]; // in "virtual clock" units (answered items)
const SRS_MAX_BOX = SRS_INTERVALS.length - 1;

function srsGet(itemId){
  if(!State.items[itemId]) State.items[itemId] = {box:0, due:0, attempts:0, correct:0, lastRt:0};
  return State.items[itemId];
}
function srsIsDue(itemId){
  const it = srsGet(itemId);
  return it.attempts === 0 || it.due <= State.clock;
}
function srsMasteryLevel(itemId){
  const it = srsGet(itemId);
  if(it.attempts === 0) return 'new';
  if(it.box >= 4) return 'mastered';
  if(it.box >= 2) return 'learning';
  return 'weak';
}
function srsAnswer(itemId, correct, rtMs, topic, moduleId){
  State.clock++;
  const it = srsGet(itemId);
  it.attempts++;
  State.totalAttempts++;
  State.totalRt += rtMs||0;
  if(correct){
    it.correct++;
    it.box = Math.min(SRS_MAX_BOX, it.box+1);
    State.totalCorrect++;
    State.combo++;
    State.bestCombo = Math.max(State.bestCombo, State.combo);
  } else {
    it.box = 0;
    State.combo = 0;
  }
  it.due = State.clock + SRS_INTERVALS[it.box];
  it.lastRt = rtMs||0;

  if(topic){
    if(!State.topics[topic]) State.topics[topic] = {attempts:0, correct:0};
    State.topics[topic].attempts++;
    if(correct) State.topics[topic].correct++;
  }
  if(moduleId){
    if(!State.moduleStats[moduleId]) State.moduleStats[moduleId] = {attempts:0, correct:0, rt:0};
    State.moduleStats[moduleId].attempts++;
    State.moduleStats[moduleId].rt += rtMs||0;
    if(correct) State.moduleStats[moduleId].correct++;
  }

  // XP: base 10, speed bonus up to +8, streak bonus up to +10
  let xpGain = 0;
  if(correct){
    xpGain = 10;
    if(rtMs && rtMs < 4000) xpGain += Math.round(8 * (1 - rtMs/4000));
    xpGain += Math.min(10, Math.floor(State.combo/3));
  } else {
    xpGain = 1; // small consolation XP for attempting
  }
  State.xp += xpGain;
  return {xpGain, box:it.box, mastery:srsMasteryLevel(itemId)};
}

function weakestTopics(limit=5){
  const rows = Object.entries(State.topics)
    .filter(([,v])=>v.attempts>=2)
    .map(([topic,v])=>({topic, attempts:v.attempts, correct:v.correct, missRate: 1-(v.correct/v.attempts)}))
    .sort((a,b)=>b.missRate-a.missRate || b.attempts-a.attempts);
  return rows.slice(0,limit);
}

function retentionScore(){

  if(all.length===0) return 0;

}

// Build an interleaved queue from multiple item pools.
// pools: [{items:[...], weight:1}], each item needs unique `id`.
function buildInterleavedQueue(pools, count){
  const due = [], fresh = [], learned = [];
  pools.forEach(p=>{
    p.items.forEach(it=>{
      const s = srsGet(it.id);
      if(s.attempts>0 && s.due<=State.clock+2 && s.box<4) due.push(it);
      else if(s.attempts===0) fresh.push(it);
      else if(s.box<4) learned.push(it);
    });
  });
  function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
  const dueS = shuffle(due), freshS = shuffle(fresh), learnedS = shuffle(learned);
  const queue = [];
  // Priority: due-for-review items first (weak spot targeting), interleaved with fresh new items, topped up with learned-but-not-mastered.
  let di=0, fi=0, li=0;
  while(queue.length < count && (di<dueS.length || fi<freshS.length || li<learnedS.length)){
    if(di<dueS.length && queue.length%3!==2){ queue.push(dueS[di++]); continue; }
    if(fi<freshS.length){ queue.push(freshS[fi++]); continue; }
    if(di<dueS.length){ queue.push(dueS[di++]); continue; }
    if(li<learnedS.length){ queue.push(learnedS[li++]); continue; }
    break;
  }
  // if still short (small pools), cycle through everything again
  if(queue.length < count){
    const all = shuffle(pools.flatMap(p=>p.items));
    let k=0;
    while(queue.length<count && all.length>0){ queue.push(all[k%all.length]); k++; }
  }
  return queue.slice(0,count);
}

function buildBossQueue(pools, count){
  const all = pools.flatMap(p=>p.items);
  const scored = all.map(it=>{
    const s = srsGet(it.id);
    const missRate = s.attempts>0 ? 1-(s.correct/s.attempts) : 0.5;
    return {it, score: missRate*10 + (s.attempts===0?2:0) - s.box};
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,count).map(x=>x.it).sort(()=>Math.random()-0.5);
}

/**
 * Run a drill queue.
 * opts: {
 *   container, queue, moduleId, title,
 *   onProgress(idx,total), onComplete(summary), timeLimitMs (optional per-item soft timer)
 * }
 */
function runDrill(opts){
  const { container, queue, moduleId, onComplete } = opts;
  let idx = 0, startedAt = 0, resultsLog = [];
  let localCombo = 0;

  function renderShell(){
    container.innerHTML = '';
    const shell = el('div','drill-shell route-fade');
    const topline = el('div','drill-topline');
    topline.innerHTML = `<span>Item <span id="dq-idx">${idx+1}</span> / ${queue.length}</span><span class="combo">Combo <span id="dq-combo">${State.combo}</span></span>`;
    shell.appendChild(topline);
    const track = el('div','progress-track');
    track.style.marginBottom='var(--space-5)';
    const fill = el('div','progress-fill'); fill.style.width = Math.round(100*idx/queue.length)+'%';
    track.appendChild(fill);
    shell.appendChild(track);
    const cardHost = el('div'); cardHost.id='dq-card-host';
    shell.appendChild(cardHost);
    container.appendChild(shell);
    renderItem();
  }

  function renderItem(){
    const host = document.getElementById('dq-card-host');
    host.innerHTML = '';
    if(idx >= queue.length){ finish(); return; }
    const item = queue[idx];
    startedAt = performance.now();
    const card = el('div','drill-card');
    card.appendChild(el('span','drill-topic', item.topic||opts.title||''));
    const s = srsGet(item.id);
    card.appendChild(el('span','drill-due', s.attempts===0?'new':(s.box>=4?'mastered':'box '+s.box)));
    const promptEl = el('div','drill-prompt'+(item.promptMono?' mono':''), item.prompt);
    card.appendChild(promptEl);
    if(item.hint) card.appendChild(el('div','drill-hint', item.hint));
    if(item.audioBtn){
      const btn = el('button','btn btn-ghost btn-sm','▶ Play again');
      btn.style.marginTop='var(--space-2)';
      btn.addEventListener('click', ()=>item.audioBtn());
      card.appendChild(btn);
      item.audioBtn();
    }
    host.appendChild(card);

    if(item.type === 'mc'){
      renderMC(item, host);
    } else if(item.type === 'typed'){
      renderTyped(item, host);
    } else if(item.type === 'custom' && item.renderCustom){
      item.renderCustom(host, (correct, extra)=>grade(item, correct, extra));
    }
  }

  function renderMC(item, host){
    const wrap = el('div','choices');
    const order = item.choices.map((c,i)=>i);
    order.forEach((choiceIdx, pos)=>{
      const btn = el('button','choice-btn');
      btn.innerHTML = `<span class="k">${pos+1}</span><span>${item.choices[choiceIdx]}</span>`;
      btn.addEventListener('click', ()=>selectMC(item, host, choiceIdx, wrap));
      wrap.appendChild(btn);
    });
    host.appendChild(wrap);
    const keyHandler = (e)=>{
      const n = parseInt(e.key,10);
      if(n>=1 && n<=order.length && !wrap.dataset.locked){
        selectMC(item, host, order[n-1], wrap);
      }
    };
    document.addEventListener('keydown', keyHandler);
    wrap._keyHandler = keyHandler;
  }
  function selectMC(item, host, choiceIdx, wrap){
    if(wrap.dataset.locked) return;
    wrap.dataset.locked = '1';
    document.removeEventListener('keydown', wrap._keyHandler);
    const correct = choiceIdx === item.answerIndex;
    [...wrap.children].forEach((btn,i)=>{
      btn.disabled = true;
      if(i===item.answerIndex) btn.classList.add(correct? 'correct':'reveal-correct');
      else if(i===choiceIdx) btn.classList.add('wrong');
    });
    grade(item, correct, {chosen: item.choices[choiceIdx], correctText: item.choices[item.answerIndex]}, host);
  }

  function renderTyped(item, host){
    const row = el('div','type-row');
    const input = el('input','type-input');
    input.type='text'; input.autocomplete='off'; input.spellcheck=false;
    input.placeholder = item.placeholder || 'Type your answer';
    row.appendChild(input);
    const btn = el('button','btn btn-primary','Check');
    row.appendChild(btn);
    host.appendChild(row);
    setTimeout(()=>input.focus(), 30);
    function submit(){
      if(row.dataset.locked) return;
      row.dataset.locked='1';
      const val = input.value.trim();
      const accepted = item.answerText.some(a=>a.toLowerCase()===val.toLowerCase());
      input.disabled = true; btn.disabled = true;
      input.classList.add(accepted?'correct':'wrong');
      grade(item, accepted, {chosen: val||'(blank)', correctText: item.answerText[0]}, host);
    }
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
  }

  function grade(item, correct, extra, host){
    const rt = performance.now()-startedAt;
    const res = srsAnswer(item.id, correct, rt, item.topic, moduleId);
    if(item.onGraded) item.onGraded(correct);
    localCombo = correct? localCombo+1 : 0;
    resultsLog.push({id:item.id, correct, rt});
    const banner = el('div','feedback-banner'+(correct?' ok':''));
    const left = el('div');
    left.innerHTML = correct? `<b>Correct</b>` : `<b>Missed</b> — <span class="fb-answer">${extra&&extra.correctText!==undefined?extra.correctText:''}</span>`;
    const right = el('div'); right.style.fontFamily='var(--font-mono)'; right.style.fontSize='var(--text-xs)';
    right.textContent = `+${res.xpGain} XP · ${Math.round(rt)}ms`;
    banner.appendChild(left); banner.appendChild(right);
    (host||document.getElementById('dq-card-host')).appendChild(banner);
    const actions = el('div','drill-actions');
    const nextBtn = el('button','btn btn-primary', idx<queue.length-1 ? 'Next  ⏎' : 'Finish  ⏎');
    nextBtn.addEventListener('click', advance);
    actions.appendChild(nextBtn);
    (host||document.getElementById('dq-card-host')).appendChild(actions);
    document.getElementById('stat-combo').textContent = State.combo;
    document.getElementById('stat-xp').textContent = State.xp;
    document.getElementById('stat-rank').textContent = masteryRank();
    const enterHandler = (e)=>{ if(e.key==='Enter'){ document.removeEventListener('keydown', enterHandler); advance(); } };
    document.addEventListener('keydown', enterHandler);
    nextBtn._enterHandler = enterHandler;
  }

  function advance(){
    idx++;
    if(opts.onProgress) opts.onProgress(idx, queue.length);
    renderShell();
  }

  function finish(){
    const correctCount = resultsLog.filter(r=>r.correct).length;
    const summary = {
      total: resultsLog.length,
      correct: correctCount,
      accuracy: resultsLog.length? correctCount/resultsLog.length : 0,
      avgRt: resultsLog.length? Math.round(resultsLog.reduce((a,r)=>a+r.rt,0)/resultsLog.length) : 0,
      bestCombo: localCombo,
    };
    if(onComplete) onComplete(summary);
  }

  renderShell();
  return { skip: advance };
}

function renderDrillSummary(container, summary, opts={}){
  container.innerHTML = '';

  const card = el('div','card');
  card.style.textAlign='center';

    <span class="eyebrow">Session complete</span>
    <h2 class="view-title" style="margin-bottom:var(--space-4)">${opts.title||'Drill finished'}</h2>
    <div class="grid grid-3" style="max-width:480px;margin:0 auto var(--space-5)">

  wrap.appendChild(card);
  container.appendChild(wrap);
}

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }
function shuffleArr(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function mcFrom(correctText, pool, count=4){
  const distractors = shuffleArr(pool.filter(x=>x!==correctText)).slice(0,count-1);
  const choices = shuffleArr([correctText, ...distractors]);
  return {choices, answerIndex: choices.indexOf(correctText)};
}

function buildAlphabetPool(){

function buildScaleSpellingPool(){
  const items = [];
  const scaleIds = ['major','nat_minor','harm_minor','mel_minor','maj_pent','min_pent','blues','dorian','phrygian','lydian','mixolydian','locrian','harm_major','phryg_dom','hungarian_min','whole_tone','dim_wh'];
  scaleIds.forEach((sid, si)=>{
    const scale = scaleById(sid);
    for(let i=0;i<2;i++){

      prompt:`Which note is NOT in ${pcName(rootPc2)} ${scale.name}?`, promptMono:true,
      choices, answerIndex: choices.indexOf(pcName(outside)) });
  });
  return items;
}

      while(pool.length<4){
        const fakeRoot = randInt(0,11);
        const fakeType = rand(CHORD_TYPES);
        const fake = buildChord(fakeRoot, fakeType.id).map(pc=>pcName(pc)).join(' - ');
        if(!pool.includes(fake)) pool.push(fake);
      }
      const choices = shuffleArr(pool);
      items.push({ id:`th-7th-${ct.id}-${i}`, topic:'Seventh chords & extensions', type:'mc',
        prompt:`Spell ${pcName(rootPc)}${ct.symbol}.`, promptMono:true,
        choices, answerIndex: choices.indexOf(correct) });
    }
  });
  // borrowed chords & secondary dominants (conceptual)
  const borrowed = [
    {q:'A chord borrowed from the parallel minor into a major key (e.g. bVI, bVII, iv) is called a...', choices:['Borrowed (modal mixture) chord','Secondary dominant','Passing chord','Neapolitan chord'], a:0},
    {q:'A "secondary dominant" is a chord that functions as the V of...', choices:['A scale degree other than the tonic','The subdominant only','The relative minor only','The tritone substitute'], a:0},
    {q:'V7/V (five of five) in the key of C major resolves most naturally to...', choices:['G (V)','C (I)','F (IV)','A minor (vi)'], a:0},
    {q:'Borrowing the iv chord (minor four) into a major key is a classic example of...', choices:['Modal mixture','Secondary dominant','Tritone substitution','Pivot modulation'], a:0},
    {q:'A secondary dominant\'s chord symbol "V7/ii" means it resolves to which diatonic chord?', choices:['ii','V','vi','IV'], a:0},
  ];
  borrowed.forEach((b,i)=>{
    const choices = shuffleArr(b.choices);
    items.push({ id:'th-borrowed-'+i, topic:'Borrowed chords & secondary dominants', type:'mc',
      prompt:b.q, choices, answerIndex: choices.indexOf(b.choices[b.a]) });
  });
  return items;
}

function buildCagedPool(){
  const items = [];
  CAGED_ORDER.forEach((shape,i)=>{
    const {choices, answerIndex} = mcFrom(CAGED_INFO[shape].rootString, CAGED_ORDER.map(s=>CAGED_INFO[s].rootString));
    items.push({ id:'th-caged-root-'+shape, topic:'CAGED system', type:'mc',
      prompt:`In the CAGED system, the "${shape}" shape carries its main root on the...`, choices, answerIndex });
  });
  for(let i=0;i<5;i++){
    const startIdx = randInt(0,4);
    const nextIdx = (startIdx+1)%5;
    const {choices, answerIndex} = mcFrom(CAGED_ORDER[nextIdx], CAGED_ORDER);
    items.push({ id:'th-caged-order-'+i, topic:'CAGED system', type:'mc',
      prompt:`Moving up the neck, the shape after "${CAGED_ORDER[startIdx]}" in the CAGED cycle is...`, choices, answerIndex });
  }
  return items;
}

function buildCircleOfFifthsPool(){
  const items = [];
  CIRCLE_OF_FIFTHS.forEach((k,i)=>{
    const {choices, answerIndex} = mcFrom(k.min, CIRCLE_OF_FIFTHS.map(x=>x.min));
    items.push({ id:'th-cof-relmin-'+i, topic:'Circle of fifths', type:'mc',
      prompt:`What is the relative minor of ${k.maj} major?`, choices, answerIndex });
    const sig = k.sharps>0? `${k.sharps} sharp${k.sharps>1?'s':''}` : (k.flats>0? `${k.flats} flat${k.flats>1?'s':''}` : 'no sharps or flats');
    const {choices:c2, answerIndex:a2} = mcFrom(sig, ['no sharps or flats','1 sharp','2 sharps','3 sharps','4 sharps','5 sharps','1 flat','2 flats','3 flats','4 flats','5 flats','6 sharps']);
    items.push({ id:'th-cof-sig-'+i, topic:'Circle of fifths', type:'mc',
      prompt:`How many sharps or flats does ${k.maj} major have?`, choices:c2, answerIndex:a2 });
  });
  for(let i=0;i<6;i++){
    const idx = randInt(0,11);
    const next = CIRCLE_OF_FIFTHS[(idx+1)%12];
    const {choices, answerIndex} = mcFrom(next.maj, CIRCLE_OF_FIFTHS.map(x=>x.maj));
    items.push({ id:'th-cof-next-'+i, topic:'Circle of fifths', type:'mc',
      prompt:`Moving clockwise (up a 5th) from ${CIRCLE_OF_FIFTHS[idx].maj} major, the next key is...`, choices, answerIndex });
  }
  return items;
}

function buildModePool(){
  const items = [];
  MODE_ORDER.forEach((mid,i)=>{
    const {choices, answerIndex} = mcFrom(MODE_DISPLAY[mid], Object.values(MODE_DISPLAY));
    items.push({ id:'th-mode-name-'+i, topic:'Modes', type:'mc',
      prompt:`The mode built on scale degree ${i+1} of the major scale is called...`, choices, answerIndex });
  });
  const modeMoods = {major:'Bright, resolved — the default major sound', dorian:'Minor but with a bright 6th — cool, unresolved minor', phrygian:'Dark, exotic — flamenco/metal flavor from the b2', lydian:'Dreamy, floating — major with a raised 4th', mixolydian:'Bluesy major — major scale with a b7', nat_minor:'Sad, dark — the standard natural minor sound', locrian:'Unstable, tense — diminished 5th makes it hard to resolve to'};
  Object.entries(modeMoods).forEach(([mid,desc],i)=>{
    const {choices, answerIndex} = mcFrom(MODE_DISPLAY[mid], Object.values(MODE_DISPLAY));
    items.push({ id:'th-mode-mood-'+i, topic:'Modes', type:'mc',
      prompt:`Which mode: "${desc}"?`, choices, answerIndex });
  });
  return items;
}

function buildAllTheoryPools(){
  return {
    alphabet: {name:'Musical Alphabet & Steps', items: buildAlphabetPool()},
    intervals: {name:'Intervals', items: buildIntervalPool()},
    scales: {name:'Scales', items: buildScaleSpellingPool()},
    degrees: {name:'Scale Degrees', items: buildDegreePool()},
    diatonic: {name:'Diatonic Harmony & Roman Numerals', items: buildDiatonicPool()},
    minorFamily: {name:'Minor-Key Chord Families', items: buildMinorFamilyPool()},
    triads: {name:'Triads & Inversions', items: buildTriadPool()},
    sevenths: {name:'7th Chords, Extensions & Borrowed Chords', items: buildSeventhExtensionPool()},
    caged: {name:'CAGED System', items: buildCagedPool()},
    circleOfFifths: {name:'Circle of Fifths', items: buildCircleOfFifthsPool()},
    modes: {name:'Modes', items: buildModePool()},
  };
}

const FRET_MARKERS = [3,5,7,9,12,15,17,19,21];
function isNaturalPc(pc){ return [0,2,4,5,7,9,11].includes(pc); }

function renderFretboardDiagram(fretMin, fretMax, stringsAllowed, cellRenderer, onCellClick){
  const wrap = el('div','fretboard-wrap');
  const board = el('div','fretboard');
  for(let s=0; s<6; s++){
    if(!stringsAllowed.has(s)) continue;
    const row = el('div','fret-row');
    const label = el('div','fret-cell', `<span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted)">${STRING_NAMES[s].split(' ')[0]}</span>`);
    row.appendChild(label);
    for(let f=fretMin; f<=fretMax; f++){
      const cell = el('div','fret-cell');
      cell.appendChild(el('div','string-line'));
      if(FRET_MARKERS.includes(f) && s===2){ /* marker only drawn once via row 2 for visual reference */ }
      const info = cellRenderer(s,f);
      if(info){
        const dot = el('div','note-dot'+(info.cls?(' '+info.cls):''), info.label!==undefined?info.label:'');
        if(onCellClick) dot.addEventListener('click', ()=>onCellClick(s,f));
        cell.appendChild(dot);
      }
      row.appendChild(cell);
    }
    board.appendChild(row);
  }
  // fret number row
  const numRow = el('div','fret-row');
  numRow.appendChild(el('div','fret-cell',''));
  for(let f=fretMin; f<=fretMax; f++){
    numRow.appendChild(el('div','fret-num', FRET_MARKERS.includes(f)? `<b>${f}</b>` : f));
  }
  board.appendChild(numRow);
  wrap.appendChild(board);
  return wrap;
}

const FretboardSprint = (function(){
  let settings = {
    mode: 'name',        // name | find | octave
    input: 'mc',          // mc | typed
    naturalOnly: false,
    strings: new Set([0,1,2,3,4,5]),
    fretMin: 0,
    fretMax: 12,
    findString: 0,
  };
  let sessionCount = 0, sessionTarget = 15, sessionCorrect = 0, container = null;
  let current = null;

  function candidateCells(){
    const cells = [];
    settings.strings.forEach(s=>{
      for(let f=settings.fretMin; f<=settings.fretMax; f++){
        const pc = noteAtStringFret(s,f);
        if(settings.naturalOnly && !isNaturalPc(pc)) continue;
        cells.push({s,f,pc});
      }
    });
    return cells;
  }

  function pickCell(){
    const cells = candidateCells();
    if(cells.length===0) return null;
    const due = cells.filter(c=>{ const it = srsGet('fb-'+c.s+'-'+c.f); return it.attempts>0 && it.due<=State.clock+2 && it.box<4; });
    if(due.length && Math.random()<0.55) return rand(due);
    const fresh = cells.filter(c=>srsGet('fb-'+c.s+'-'+c.f).attempts===0);
    if(fresh.length && Math.random()<0.6) return rand(fresh);
    return rand(cells);
  }

  let panelHost = null;

  function refreshPanel(){
    if(!panelHost) return;
    panelHost.innerHTML='';
    panelHost.appendChild(buildSettingsPanel());
  }

  function renderSettingsPanel(){
    panelHost = el('div');
    panelHost.appendChild(buildSettingsPanel());
    return panelHost;
  }

  function buildSettingsPanel(){
    const panel = el('div','card card-tight');
    panel.style.marginBottom='var(--space-5)';
    panel.innerHTML = `
      <div class="grid grid-3" style="align-items:end">
        <div>
          <span class="eyebrow">Drill mode</span>
          <div class="segmented" id="fb-mode-seg">
            <button data-v="name" class="${settings.mode==='name'?'active':''}">Name it</button>
            <button data-v="find" class="${settings.mode==='find'?'active':''}">Find it</button>
            <button data-v="octave" class="${settings.mode==='octave'?'active':''}">Octave</button>
          </div>
        </div>
        <div>
          <span class="eyebrow">Answer input</span>
          <div class="segmented" id="fb-input-seg">
            <button data-v="mc" class="${settings.input==='mc'?'active':''}">Multiple choice</button>
            <button data-v="typed" class="${settings.input==='typed'?'active':''}">Typed</button>
          </div>
        </div>
        <div>
          <span class="eyebrow">Note set</span>
          <div class="segmented" id="fb-natural-seg">
            <button data-v="0" class="${!settings.naturalOnly?'active':''}">Chromatic</button>
            <button data-v="1" class="${settings.naturalOnly?'active':''}">Natural only</button>
          </div>
        </div>
      </div>
      <hr class="div">
      <div class="grid grid-2">
        <div>
          <span class="eyebrow">Strings</span>
          <div class="pool-toggle" id="fb-strings">
            ${STRING_NAMES.map((n,i)=>`<span class="tag ${settings.strings.has(i)?'on':''}" data-s="${i}" style="cursor:pointer">${n}</span>`).join('')}
          </div>
        </div>
        <div>
          <span class="eyebrow">Fret range: <span id="fb-range-label">${settings.fretMin}–${settings.fretMax}</span></span>
          <div style="display:flex;gap:var(--space-3);align-items:center">
            <input type="range" id="fb-fret-min" min="0" max="21" value="${settings.fretMin}">
            <input type="range" id="fb-fret-max" min="0" max="21" value="${settings.fretMax}">
          </div>
        </div>
      </div>
    `;
    panel.querySelectorAll('#fb-mode-seg button').forEach(b=>b.addEventListener('click',()=>{ settings.mode=b.dataset.v; refreshPanel(); startSession(); }));
    panel.querySelectorAll('#fb-input-seg button').forEach(b=>b.addEventListener('click',()=>{ settings.input=b.dataset.v; refreshPanel(); startSession(); }));
    panel.querySelectorAll('#fb-natural-seg button').forEach(b=>b.addEventListener('click',()=>{ settings.naturalOnly=b.dataset.v==='1'; refreshPanel(); startSession(); }));
    panel.querySelectorAll('#fb-strings .tag').forEach(t=>t.addEventListener('click',()=>{
      const s = parseInt(t.dataset.s,10);
      if(settings.strings.has(s)){ if(settings.strings.size>1) settings.strings.delete(s); } else settings.strings.add(s);
      refreshPanel();
      startSession();
    }));
    panel.querySelector('#fb-fret-min').addEventListener('input',(e)=>{ settings.fretMin=Math.min(parseInt(e.target.value,10), settings.fretMax); const lbl=panel.querySelector('#fb-range-label'); if(lbl) lbl.textContent=settings.fretMin+'\u2013'+settings.fretMax; startSession(); });
    panel.querySelector('#fb-fret-max').addEventListener('input',(e)=>{ settings.fretMax=Math.max(parseInt(e.target.value,10), settings.fretMin); const lbl=panel.querySelector('#fb-range-label'); if(lbl) lbl.textContent=settings.fretMin+'\u2013'+settings.fretMax; startSession(); });
    return panel;
  }

  function generateQuestion(){
    const cell = pickCell();
    if(!cell) return null;
    let mode = settings.mode;
    if(mode==='octave' && cell.f+12>21 && cell.f-12<0) mode='name';
    return {cell, mode};
  }

  function renderQuestion(){
    const host = document.getElementById('fb-host');
    host.innerHTML='';
    current = generateQuestion();
    if(!current){ host.appendChild(el('div','empty','Select at least one string to begin.')); return; }
    const {cell, mode} = current;
    const topline = el('div','drill-topline');
    topline.innerHTML = `<span>Note ${sessionCount+1} / ${sessionTarget}</span><span class="combo">Combo <span id="stat-combo-fb">${State.combo}</span></span>`;
    host.appendChild(topline);
    const trk = el('div','progress-track'); trk.style.marginBottom='var(--space-5)';
    trk.appendChild((()=>{ const f=el('div','progress-fill'); f.style.width=Math.round(100*sessionCount/sessionTarget)+'%'; return f; })());
    host.appendChild(trk);

    const promptWrap = el('div','card');
    promptWrap.style.textAlign='center';
    let promptText, board, answerZone = el('div');

    if(mode==='name'){
      promptText = 'Name this note.';
      const targetNote = pcName(cell.pc);
      board = renderFretboardDiagram(settings.fretMin, settings.fretMax, settings.strings, (s,f)=>{
        if(s===cell.s && f===cell.f) return {cls:'target'};
        return null;
      }, null);
      promptWrap.appendChild(el('div','drill-topic','Fretboard Sprint · Name it'));
      promptWrap.appendChild(el('h3','',promptText));
      promptWrap.appendChild(board);
      answerZone = buildAnswerZone(targetNote, (correct, chosenText)=>gradeCell(cell, correct, chosenText, targetNote));
      promptWrap.appendChild(answerZone);
    } else if(mode==='find'){
      const targetNote = pcName(cell.pc);
      promptWrap.appendChild(el('div','drill-topic','Fretboard Sprint · Find it'));
      promptWrap.appendChild(el('h3','',`Tap every ${targetNote} on the ${STRING_NAMES[cell.s]} string.`));
      const validFrets = [];
      for(let f=settings.fretMin; f<=settings.fretMax; f++){ if(noteAtStringFret(cell.s,f)===cell.pc) validFrets.push(f); }
      let hits = new Set(), misses = new Set(), locked=false;
      const singleStringSet = new Set([cell.s]);
      const rerender = ()=>{
        const b2 = renderFretboardDiagram(settings.fretMin, settings.fretMax, singleStringSet, (s,f)=>{
          if(hits.has(f)) return {cls:'note-dot hit', label:''};
          if(misses.has(f)) return {cls:'note-dot miss', label:''};
          return {cls:'', label:''};
        }, (s,f)=>{
          if(locked) return;
          if(validFrets.includes(f)){
            hits.add(f);
            if(hits.size===validFrets.length){ locked=true; gradeCell(cell, true, 'tapped all', targetNote); }
            else { rerender(); }
          } else {
            misses.add(f); locked=true;
            gradeCell(cell, false, 'wrong fret', targetNote, validFrets);
          }
        });
        boardHost.innerHTML=''; boardHost.appendChild(b2);
      };
      const boardHost = el('div');
      promptWrap.appendChild(boardHost);
      rerender();
    } else if(mode==='octave'){
      const up = cell.f+12<=21;
      const targetFret = up? cell.f+12 : cell.f-12;
      const targetNote = pcName(cell.pc);
      promptWrap.appendChild(el('div','drill-topic','Fretboard Sprint · Octave'));
      promptWrap.appendChild(el('h3','',`This is ${targetNote} on the ${STRING_NAMES[cell.s]} string, fret ${cell.f}. Type the fret for the same note one octave ${up?'higher':'lower'} on the same string.`));
      const bd = renderFretboardDiagram(settings.fretMin, Math.max(settings.fretMax,21), new Set([cell.s]), (s,f)=>{
        if(s===cell.s && f===cell.f) return {cls:'target'};
        return null;
      }, null);
      promptWrap.appendChild(bd);
      const row = el('div','type-row');
      const input = el('input','type-input'); input.type='number'; input.placeholder='Fret #';
      const btn = el('button','btn btn-primary','Check');
      row.appendChild(input); row.appendChild(btn);
      promptWrap.appendChild(row);
      const submit = ()=>{
        if(row.dataset.locked) return; row.dataset.locked='1';
        const val = parseInt(input.value,10);
        const correct = val===targetFret;
        input.disabled=true; btn.disabled=true;
        input.classList.add(correct?'correct':'wrong');
        gradeCell(cell, correct, String(val), String(targetFret));
      };
      btn.addEventListener('click',submit);
      input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
      setTimeout(()=>input.focus(),20);
    }
    host.appendChild(promptWrap);
  }

  function buildAnswerZone(targetNote, onAnswered){
    const zone = el('div');
    if(settings.input==='mc'){
      const pool = settings.naturalOnly ? PC_SHARP.filter(n=>!n.includes('#')) : PC_SHARP;
      const {choices, answerIndex} = mcFrom(targetNote, pool);
      const wrap = el('div','choices');
      choices.forEach((c,i)=>{
        const b = el('button','choice-btn', `<span class="k">${i+1}</span><span>${c}</span>`);
        b.addEventListener('click',()=>{
          if(wrap.dataset.locked) return; wrap.dataset.locked='1';
          const correct = c===targetNote;
          [...wrap.children].forEach((btn,j)=>{ btn.disabled=true; if(j===answerIndex) btn.classList.add(correct?'correct':'reveal-correct'); else if(btn===b) btn.classList.add('wrong'); });
          onAnswered(correct, c);
        });
        wrap.appendChild(b);
      });
      zone.appendChild(wrap);
    } else {
      const row = el('div','type-row');
      const input = el('input','type-input'); input.placeholder='Note name (e.g. F#)';
      const btn = el('button','btn btn-primary','Check');
      row.appendChild(input); row.appendChild(btn);
      const submit = ()=>{
        if(row.dataset.locked) return; row.dataset.locked='1';
        const val = input.value.trim();
        const norm = v=>v.replace('♯','#').replace('♭','b').trim().toUpperCase().replace('B','b').replace(/^([A-G])b/i,(m,l)=>l.toUpperCase()+'b').replace(/^([A-G])#/i,(m,l)=>l.toUpperCase()+'#');
        const acceptable = [targetNote, ENHARMONIC[targetNote]].filter(Boolean).map(x=>x.toUpperCase());
        const correct = acceptable.includes(val.toUpperCase());
        input.disabled=true; btn.disabled=true; input.classList.add(correct?'correct':'wrong');
        onAnswered(correct, val);
      };
      btn.addEventListener('click',submit);
      input.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
      row.appendChild(input);
      zone.appendChild(row);
      setTimeout(()=>input.focus(),20);
    }
    return zone;
  }

  function gradeCell(cell, correct, chosenText, correctText, extraValidFrets){
    const itemId = 'fb-'+cell.s+'-'+cell.f;
    const rt = performance.now() - (current.startedAt||performance.now());
    const res = srsAnswer(itemId, correct, rt, 'Fretboard: '+STRING_NAMES[cell.s], 'fretboard');
    sessionCount++;
    if(correct) sessionCorrect++;
    const host = document.getElementById('fb-host');
    const banner = el('div','feedback-banner'+(correct?' ok':''));
    banner.innerHTML = `<div><b>${correct?'Correct':'Missed'}</b>${correct?'':` — answer: <span class="fb-answer">${correctText}</span>`}</div><div style="font-family:var(--font-mono);font-size:var(--text-xs)">+${res.xpGain} XP</div>`;
    host.appendChild(banner);
    const actions = el('div','drill-actions');
    const nextBtn = el('button','btn btn-primary', sessionCount<sessionTarget? 'Next  ⏎':'Finish  ⏎');
    nextBtn.addEventListener('click', ()=>{
      if(sessionCount>=sessionTarget) finishSession(); else renderQuestion();
    });
    actions.appendChild(nextBtn);
    host.appendChild(actions);
    const enterHandler=(e)=>{ if(e.key==='Enter'){ document.removeEventListener('keydown',enterHandler); nextBtn.click(); } };
    document.addEventListener('keydown', enterHandler);
    document.getElementById('stat-combo').textContent = State.combo;
    document.getElementById('stat-xp').textContent = State.xp;
    document.getElementById('stat-rank').textContent = masteryRank();
  }

  function finishSession(){
    const host = document.getElementById('fb-host');
    renderDrillSummary(host, {
      total: sessionTarget, correct: sessionCorrect,
      accuracy: sessionCorrect/sessionTarget,
      avgRt: 0,
    }, { title:'Fretboard Sprint', onRetry: startSession, onDone: ()=>Router.go('home') });
  }

  function startSession(){
    sessionCount=0; sessionCorrect=0;
    renderQuestion();
    current && (current.startedAt = performance.now());
  }

  function mount(hostContainer){
    container = hostContainer;
    container.innerHTML='';
    const wrap = el('div','route-fade');
    wrap.appendChild(el('div','view-head','<div><span class="eyebrow">Module 02</span><h1 class="view-title">Fretboard Sprint</h1><p class="view-sub">Single-note ID drills across the neck — typed or multiple choice, natural or chromatic, with weak-note resurfacing.</p></div>'));
    wrap.appendChild(renderSettingsPanel());
    const host = el('div'); host.id='fb-host'; host.className='drill-shell';
    wrap.appendChild(host);
    container.appendChild(wrap);
    startSession();
  }

  return { mount };
})();

const EarTrainer = (function(){
  let mode = 'notes';
  let sessionCount=0, sessionTarget=10, sessionCorrect=0;
  let micActive = false;

  const MODES = [
    {id:'notes', label:'Notes'},
    {id:'intervals', label:'Intervals'},

    {id:'progressions', label:'Progressions'},
    {id:'sing', label:'Sing & Match'},
    {id:'callresponse', label:'Call & Response'},
    {id:'transcribe', label:'Micro-Transcription'},
  ];
  const CHORD_QUAL_IDS = ['maj','min','dim','aug','maj7','dom7','min7','m7b5','dim7'];

  function earGrade(correct){ State.earScore.attempts++; if(correct) State.earScore.correct++; }

  function statUpdate(){
    document.getElementById('stat-combo').textContent = State.combo;
    document.getElementById('stat-xp').textContent = State.xp;
    document.getElementById('stat-rank').textContent = masteryRank();
  }

  function renderModeSwitch(host){
    const seg = el('div','segmented');
    seg.style.flexWrap='wrap';

      const b = el('button', mode===m.id?'active':'', m.label);
      b.addEventListener('click',()=>{ mode=m.id; startSession(); });
      seg.appendChild(b);
    });
    host.appendChild(seg);
  }

  function playAndNext(playFn, buildAnswer){
    const host = document.getElementById('ear-host');
    host.innerHTML='';
    const topline = el('div','drill-topline');
    topline.innerHTML = `<span>Item ${sessionCount+1} / ${sessionTarget}</span><span class="combo">Combo <span>${State.combo}</span></span>`;
    host.appendChild(topline);
    const trk = el('div','progress-track'); trk.style.marginBottom='var(--space-5)';
    const f=el('div','progress-fill'); f.style.width=Math.round(100*sessionCount/sessionTarget)+'%'; trk.appendChild(f);
    host.appendChild(trk);
    const card = el('div','drill-card');
    card.appendChild(el('span','drill-topic','Ear Trainer · '+MODES.find(m=>m.id===mode).label));
    buildAnswer(card, playFn);
    host.appendChild(card);

  function replayBtn(card, playFn){

  function renderMelodyRecall(kind){

    card.appendChild(el('div','drill-prompt', kind==='callresponse'? `Listen, then echo the ${len}-note phrase by picking scale degrees in order.` : `Listen, then transcribe the ${len}-note melody by picking scale degrees in order.`));
    card.appendChild(el('div','drill-hint',`Key: ${pcName(rootPc)} major — degrees shown 1–7.`));
    replayBtn(card, play);
    const answerRow = el('div','choices'); answerRow.style.gridTemplateColumns='repeat(7,1fr)';
    const picked = [];
    const readout = el('div','drill-hint'); readout.style.marginTop='var(--space-3)'; readout.textContent='Your answer: (none yet)';
    for(let d=0; d<7; d++){
      const b = el('button','choice-btn'); b.style.justifyContent='center';
      b.innerHTML = `<span>${d+1}</span>`;
      b.addEventListener('click', ()=>{
        if(picked.length>=len) return;
        picked.push(d);
        readout.textContent = 'Your answer: ' + picked.map(x=>x+1).join(' - ');
        Audio_.playMidi(60+scale[d],{dur:0.3,gain:0.15});

    }
    card.appendChild(answerRow);
    card.appendChild(readout);
    const resetBtn = el('button','btn btn-ghost btn-sm','Clear'); resetBtn.style.marginTop='var(--space-2)';
    resetBtn.addEventListener('click', ()=>{ picked.length=0; readout.textContent='Your answer: (none yet)'; });
    card.appendChild(resetBtn);
    host.appendChild(card);
    play();

    function submitMelody(){
      const correct = picked.every((d,i)=>d===melodyDeg[i]);
      const itemId = (kind==='callresponse'?'ear-cr-':'ear-mt-')+melodyDeg.join('-');
      earGrade(correct);
      const res = srsAnswer(itemId, correct, 2000, kind==='callresponse'?'Ear: Call & response':'Ear: Micro-transcription', 'ear');
      sessionCount++; if(correct) sessionCorrect++;
      const banner = el('div','feedback-banner'+(correct?' ok':''));
      banner.innerHTML = `<div><b>${correct?'Correct':'Missed'}</b>${correct?'':` — correct: <span class="fb-answer">${melodyDeg.map(x=>x+1).join('-')}</span>`}</div><div style="font-family:var(--font-mono);font-size:var(--text-xs)">+${res.xpGain} XP</div>`;
      card.appendChild(banner);
      const actions = el('div','drill-actions');
      const nextBtn = el('button','btn btn-primary', sessionCount<sessionTarget?'Next  ⏎':'Finish  ⏎');
      nextBtn.addEventListener('click', ()=> sessionCount>=sessionTarget? finishSession() : renderCurrentMode());
      actions.appendChild(nextBtn);
      card.appendChild(actions);
      statUpdate();
      [...answerRow.children].forEach(b=>b.disabled=true);
    }
  }

  function finishSession(){
    const host = document.getElementById('ear-host');

  return { mount, get earScorePct(){ return earScorePct(); } };

    {id:'7-8', label:'7/8', slots:7, groupingQ:'7/8 is most often grouped as...', choices:['2+2+3 (or a variant)','7 equal beats','3+3+1','4+3 only'], answer:0},

    row.appendChild(dec); row.appendChild(num); row.appendChild(inc);
    row.appendChild(el('span','mini-note','BPM'));
    return row;
  }

  // Generic tap-along runner.
  // slotsPerBar, bars, accentSlots (Set of slot indices considered "on beat"/accented),
  // activeSlots (Set of slot indices that require a tap), labels (optional array)
  function runTapAlong(host, {slotsPerBar, bars=4, activeSlots, accentSlots=new Set([0]), labels, onSummary, itemId, topic}){
    const totalSlots = slotsPerBar*bars;
    const slotDur = 60/bpm / (slotsPerBar/4); // assumes slotsPerBar subdivides a 4-beat-equivalent bar proportionally
    const grid = el('div','tap-grid');
    const cells = [];
    for(let i=0;i<totalSlots;i++){
      const c = el('div','tap-cell'+(activeSlots.has(i%slotsPerBar)?'':''), labels? (labels[i%slotsPerBar]||'·') : '·');
      grid.appendChild(c); cells.push(c);
    }
    host.appendChild(grid);
    const statusLine = el('div','drill-hint'); statusLine.style.marginTop='var(--space-3)'; statusLine.textContent='Press Start, then tap SPACE (or click the pad) on each marked beat.';
    host.appendChild(statusLine);
    const pad = el('button','btn btn-primary btn-block','Start');
    host.appendChild(pad);

    let running=false, t0=0, expected=[], hitCount=0, results=[];
    function begin(){
      running=true; pad.textContent='Tapping…'; pad.disabled=true;
      t0 = Audio_.now()+0.3;
      expected = [];
      for(let i=0;i<totalSlots;i++){
        const t = t0 + i*slotDur;
        const isActive = activeSlots.has(i%slotsPerBar);
        if(isActive) expected.push({idx:i, t, hit:false});
        setTimeout(()=>{ cells[i].classList.add('active'); setTimeout(()=>cells[i].classList.remove('active'), Math.min(140, slotDur*500)); }, Math.max(0,(t-Audio_.now())*1000));
        Audio_.click(accentSlots.has(i%slotsPerBar), t-Audio_.now());
      }
      const totalMs = totalSlots*slotDur*1000 + 400;
      document.addEventListener('keydown', keyHandler);
      pad.onclick = onTap;
      setTimeout(finish, totalMs);
    }
    function registerTap(){
      if(!running) return;
      const tapT = Audio_.now();
      let best=null, bestDelta=Infinity;
      expected.forEach(e=>{
        if(e.hit) return;
        const d = Math.abs(e.t-tapT);
        if(d<bestDelta){ bestDelta=d; best=e; }
      });
      if(best && bestDelta < slotDur*0.65){
        best.hit = true; hitCount++;
        cells[best.idx].classList.add('hit');
        results.push(Math.round((tapT-best.t)*1000));
      }
    }
    function onTap(){ registerTap(); }
    function keyHandler(e){ if(e.code==='Space'){ e.preventDefault(); registerTap(); } }
    function finish(){
      running=false;
      document.removeEventListener('keydown', keyHandler);
      const total = expected.length;
      const acc = total? hitCount/total : 0;
      const avgDelta = results.length? Math.round(results.reduce((a,b)=>a+Math.abs(b),0)/results.length) : 0;
      statusLine.textContent = `Hit ${hitCount}/${total} beats · avg offset ${avgDelta}ms`;
      pad.disabled=false; pad.textContent='Try again';
      pad.onclick = begin;
      if(itemId){
        const res = srsAnswer(itemId, acc>=0.75, avgDelta, topic, 'rhythm');
        statUpdate();
      }
      if(onSummary) onSummary({acc, avgDelta, hitCount, total});
    }
    pad.addEventListener('click', begin);
  }

const TechniqueGym = (function(){
  let metro = null;
  function ensureMetro(){ if(!metro) metro = Audio_.makeMetronome(); return metro; }

  function techBpm(drillId, startBpm){
    if(!State.techBpmCurrent) State.techBpmCurrent = {};
    if(State.techBpmCurrent[drillId]===undefined) State.techBpmCurrent[drillId] = startBpm;
    return State.techBpmCurrent[drillId];
  }

  function renderDrillList(container){
    container.innerHTML='';
    const wrap = el('div','route-fade');
    wrap.appendChild(el('div','view-head','<div><span class="eyebrow">Module 05</span><h1 class="view-title">Technique Gym</h1><p class="view-sub">Metronome-driven drills with clean-rep thresholds. Tempo only increases after you confirm clean reps.</p></div>'));
    const grid = el('div','grid grid-3');
    TECHNIQUE_DRILLS.forEach(d=>{
      const cur = techBpm(d.id, d.startBpm);
      const ceiling = State.bpmCeilings[d.id]||d.startBpm;
      const tile = el('button','mod-tile');
      tile.innerHTML = `<h3>${d.name}</h3><p>${d.desc}</p><div class="mod-meta"><span>Now ${cur} bpm</span><span>Ceiling ${ceiling}</span></div>`;
      tile.addEventListener('click', ()=>renderDrillDetail(container, d));
      grid.appendChild(tile);
    });
    const enduranceTile = el('button','mod-tile');
    enduranceTile.innerHTML = `<h3>Endurance Mode</h3><p>Sustained metronome session at a fixed tempo — builds stamina and consistency over time, not raw speed.</p><div class="mod-meta"><span>Timer-based</span><span>&nbsp;</span></div>`;
    enduranceTile.addEventListener('click', ()=>renderEndurance(container));
    grid.appendChild(enduranceTile);
    wrap.appendChild(grid);
    container.appendChild(wrap);
  }

  function renderDrillDetail(container, d){
    container.innerHTML='';
    const wrap = el('div','route-fade drill-shell');
    const back = el('button','btn btn-ghost btn-sm','← All drills');
    back.addEventListener('click', ()=>renderDrillList(container));
    wrap.appendChild(back);
    const card = el('div','card'); card.style.marginTop='var(--space-4)';
    card.innerHTML = `<span class="eyebrow">Technique Gym</span><h2 class="view-title">${d.name}</h2><p class="view-sub" style="margin-bottom:var(--space-5)">${d.desc}</p>`;

    const metroWrap = el('div','metronome');
    const dial = el('div','metro-dial', techBpm(d.id,d.startBpm));
    metroWrap.appendChild(dial);
    const lights = el('div','beat-lights');
    for(let i=0;i<4;i++) lights.appendChild(el('div','beat-light'+(i===0?' accent':'')));
    metroWrap.appendChild(lights);
    const bpmRow = el('div','bpm-row');
    const dec = el('button','bpm-btn','−'); const bpmNum = el('span','bpm-num',techBpm(d.id,d.startBpm)); const inc = el('button','bpm-btn','+');
    const m = ensureMetro();
    function setBpm(v){ State.techBpmCurrent[d.id]=v; bpmNum.textContent=v; dial.textContent=v; m.setBpm(v); }
    dec.addEventListener('click',()=>setBpm(Math.max(30,techBpm(d.id,d.startBpm)-2)));
    inc.addEventListener('click',()=>setBpm(Math.min(260,techBpm(d.id,d.startBpm)+2)));
    bpmRow.appendChild(dec); bpmRow.appendChild(bpmNum); bpmRow.appendChild(inc);
    metroWrap.appendChild(bpmRow);
    const playBtn = el('button','btn btn-primary','▶ Start metronome');
    let running=false;
    m.setBpm(techBpm(d.id,d.startBpm));
    m.onBeatCb((beatIdx)=>{
      [...lights.children].forEach((l,i)=>l.classList.toggle('on', i===beatIdx));
      dial.classList.remove('beat'); void dial.offsetWidth; dial.classList.add('beat');
    });
    playBtn.addEventListener('click',()=>{
      running = !running;
      if(running){ m.start(); playBtn.textContent='■ Stop metronome'; } else { m.stop(); playBtn.textContent='▶ Start metronome'; [...lights.children].forEach(l=>l.classList.remove('on')); }
    });
    metroWrap.appendChild(playBtn);
    card.appendChild(metroWrap);

    card.appendChild(el('hr','div'));

    const repRow = el('div');
    repRow.appendChild(el('div','eyebrow',`Clean-rep threshold: ${d.repsNeeded} in a row to raise tempo by ${d.inc} bpm`));
    const streakLine = el('div','drill-hint');
    let streak = 0;
    function refreshStreak(){ streakLine.innerHTML = `Clean-rep streak: <b>${streak}</b> / ${d.repsNeeded} · Ceiling reached: <b>${State.bpmCeilings[d.id]||d.startBpm} bpm</b>`; }

    const cleanBtn = el('button','btn btn-primary','Mark rep clean');

      streak++;
      bumpBpmCeiling(d.id, techBpm(d.id,d.startBpm));
      if(streak>=d.repsNeeded){
        streak=0;
        const next = Math.min(d.targetBpm, techBpm(d.id,d.startBpm)+d.inc);
        setBpm(next);
        bumpBpmCeiling(d.id, next);
        showToast(`Tempo up — ${d.name} now at ${next} BPM`);

    card.appendChild(repRow);

    wrap.appendChild(card);

    container.innerHTML='';

    const seg = el('div','segmented');
    let minutes = 5;
    [3,5,10,15].forEach(mn=>{ const b=el('button', mn===minutes?'active':'', mn+' min'); b.addEventListener('click',()=>{ [...seg.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); minutes=mn; }); seg.appendChild(b); });
    card.appendChild(seg);
    const metroWrap = el('div','metronome'); metroWrap.style.marginTop='var(--space-5)';
    let bpm = 90;
    const dial = el('div','metro-dial', bpm); metroWrap.appendChild(dial);
    const bpmRow = el('div','bpm-row');
    const dec = el('button','bpm-btn','−'); const bpmNum = el('span','bpm-num',bpm); const inc = el('button','bpm-btn','+');
    const m = ensureMetro(); m.setBpm(bpm);
    dec.addEventListener('click',()=>{ bpm=Math.max(30,bpm-4); bpmNum.textContent=bpm; dial.textContent=bpm; m.setBpm(bpm); });
    inc.addEventListener('click',()=>{ bpm=Math.min(220,bpm+4); bpmNum.textContent=bpm; dial.textContent=bpm; m.setBpm(bpm); });
    bpmRow.appendChild(dec); bpmRow.appendChild(bpmNum); bpmRow.appendChild(inc);
    metroWrap.appendChild(bpmRow);
    const timerDisplay = el('div','drill-prompt mono','00:00');
    metroWrap.appendChild(timerDisplay);
    const startBtn = el('button','btn btn-primary','▶ Start session');
    metroWrap.appendChild(startBtn);
    m.onBeatCb(()=>{ dial.classList.remove('beat'); void dial.offsetWidth; dial.classList.add('beat'); });
    let interval=null, elapsed=0;
    startBtn.addEventListener('click',()=>{
      if(interval){ clearInterval(interval); interval=null; m.stop(); startBtn.textContent='▶ Start session'; return; }
      m.start(); startBtn.textContent='■ Stop';
      const totalSec = minutes*60;
      interval = setInterval(()=>{
        elapsed++;
        const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss=String(elapsed%60).padStart(2,'0');
        timerDisplay.textContent = mm+':'+ss;
        if(elapsed>=totalSec){
          clearInterval(interval); interval=null; m.stop();
          startBtn.textContent='▶ Start session';
          State.xp += 25; document.getElementById('stat-xp').textContent = State.xp;
          bumpBpmCeiling('endurance', bpm);
          showToast(`Endurance session complete — ${minutes} min at ${bpm} BPM`);
        }
      },1000);
    });
    card.appendChild(metroWrap);
    wrap.appendChild(card);
    container.appendChild(wrap);
  }

  function mount(container){ renderDrillList(container); }
  return { mount };
})();

function buildJazzHarmonyPool(){
  const items = [];
  ['maj7','dom7','min7','m7b5','dim7'].forEach((tid,i)=>{
    const rootPc = randInt(0,11);
    const ct = chordTypeById(tid);
    const tones = buildChord(rootPc, tid).map(pc=>pcName(pc));
    const correct = tones.join(' - ');
    const pool = [correct];
    while(pool.length<4){
      const fakeRoot = randInt(0,11), fakeType = rand(CHORD_TYPES);
      const fake = buildChord(fakeRoot, fakeType.id).map(pc=>pcName(pc)).join(' - ');
      if(!pool.includes(fake)) pool.push(fake);
    }
    const choices = shuffleArr(pool);
    items.push({ id:'style-jazz-7th-'+i, topic:'Jazz Harmony: 7th chords', type:'mc', promptMono:true,
      prompt:`Spell ${pcName(rootPc)}${ct.symbol}.`, choices, answerIndex: choices.indexOf(correct) });
  });
  for(let i=0;i<4;i++){
    const rootPc = randInt(0,11);
    const type = rand(['maj','min']);
    const tones = buildChord(rootPc, type);

      answerText: chordAnswerVariants(tokens) });
  }
  items.push({ id:'style-jazz-voiceleading', topic:'Jazz Harmony: Voice leading', type:'mc',

    ...mcFrom('3rd of V7 (both fall by a half step or stay close)', ['3rd of V7 (both fall by a half step or stay close)','Root of I','5th of ii7','9th of V7']) });
  items.push({ id:'style-jazz-shell', topic:'Jazz Harmony: Shell voicings', type:'mc',
    prompt:'A "shell voicing" for a 7th chord typically uses only...',
    ...mcFrom('The root, 3rd, and 7th', ['The root, 3rd, and 7th','All four chord tones plus extensions','The 5th and 9th only','Open strings only']) });
  return items;
