function progressionTokens(rootPc, romanList, useSevenths){
  const majorSteps = [0,2,4,5,7,9,11];
  return romanList.map(roman=>{
    const clean = roman.replace('°','').replace('+','');
    const degIdx = MAJOR_KEY_ROMAN.indexOf(clean);
    const actualRoot = (rootPc + majorSteps[degIdx])%12;
    const qId = useSevenths ? MAJOR_KEY_SEVENTH_QUALITY[degIdx] : (MAJOR_KEY_TRIAD_QUALITY[degIdx]==='dim'?'dim':MAJOR_KEY_TRIAD_QUALITY[degIdx]);
    const symbol = useSevenths ? chordTypeById(qId).symbol : (qId==='maj'?'':qId==='min'?'m':'dim');
    return pcName(actualRoot)+symbol;
  });
}
function progressionAnswerString(rootPc, romanList, useSevenths){
  return progressionTokens(rootPc, romanList, useSevenths).join(' ');
}
function normalizeChordToken(s){ return s.trim().replace(/[,\-–]/g,' ').split(/\s+/).filter(Boolean); }
function chordAnswerVariants(tokens){
  return [tokens.join(' '), tokens.join(' - '), tokens.join(', '), tokens.join('-'), tokens.join(',')];
}

function buildProgressionDrillItems(templateId, useSevenths, count=8){
  const items = [];
  const prog = COMMON_PROGRESSIONS.find(p=>p.id===templateId);
  for(let i=0;i<count;i++){
    const rootPc = randInt(0,11);
    const tokens = progressionTokens(rootPc, prog.roman.map(r=>r), useSevenths);
    items.push({ id:`app-${templateId}-${rootPc}-${i}`, topic:`Application: ${prog.name}`, type:'typed', promptMono:true,
      prompt:`Key of ${pcName(rootPc)} major — spell out ${prog.roman.join('-')}.`,
      placeholder: tokens.map(()=>'').join(' '),
      answerText: chordAnswerVariants(tokens) });
  }
  return items;
}

const MODAL_VAMP_QUALITY = {major:'Major 7th', dorian:'Minor 7th', phrygian:'Minor 7th (with b2 color)', lydian:'Major 7th (#11 color)', mixolydian:'Dominant 7th', nat_minor:'Minor 7th', locrian:'Half-diminished 7th'};
function buildModalVampPool(){
  const items = [];
  Object.entries(MODAL_VAMP_QUALITY).forEach(([mid,quality],i)=>{
    const rootPc = randInt(0,11);
    items.push({ id:'app-modal-'+mid, topic:'Application: Modal vamps', type:'mc', promptMono:true,
      prompt:`A vamp on ${pcName(rootPc)} ${MODE_DISPLAY[mid]} typically centers on a tonic chord that is a...`,
      ...mcFrom(quality, Object.values(MODAL_VAMP_QUALITY)) });
  });
  return items;
}

function buildTriadCompingPool(){
  const items = [];
  const invNames = ['Root position','First inversion','Second inversion'];
  for(let i=0;i<8;i++){
    const rootPc = randInt(0,11);
    const type = rand(['maj','min']);
    const tones = buildChord(rootPc, type);
    const invIdx = randInt(0,2);
    items.push({ id:'app-comp-'+i, topic:'Application: Triad comping', type:'mc', promptMono:true,
      prompt:`Comping a ${pcName(rootPc)} ${type==='maj'?'major':'minor'} triad with ${pcName(tones[invIdx])} in the bass — which inversion?`,
      ...mcFrom(invNames[invIdx], invNames) });
  }
  return items;
}

const SCALE_OVER_CHORD_MAP = {maj7:'Ionian (Major)', dom7:'Mixolydian', min7:'Dorian', m7b5:'Locrian', dim7:'Whole-Half Diminished', minMaj7:'Melodic Minor'};
function buildScaleOverChordPool(){
  const items = [];
  Object.entries(SCALE_OVER_CHORD_MAP).forEach(([tid,scaleName],i)=>{
    const rootPc = randInt(0,11);
    const ct = chordTypeById(tid);
    items.push({ id:'app-scale-'+tid, topic:'Application: Scale over chord', type:'mc', promptMono:true,
      prompt:`Over a ${pcName(rootPc)}${ct.symbol} chord, the most idiomatic scale choice is...`,
      ...mcFrom(scaleName, Object.values(SCALE_OVER_CHORD_MAP)) });
  });
  return items;
}

function buildGenrePhrasePool(){
  return GENRE_PHRASE_STUDIES.map(g=>({
    id:'app-genre-'+g.id, topic:'Application: Genre phrase studies', type:'mc',
    prompt: g.title+' — '+g.body, promptMono:false,

  }));
}

let THEORY_POOLS = null;
function getTheoryPools(){ if(!THEORY_POOLS) THEORY_POOLS = buildAllTheoryPools(); return THEORY_POOLS; }

function allQuizPoolsFlat(){
  const t = getTheoryPools();
  const pools = Object.values(t).map(p=>p.items);
  pools.push(buildMetalLeadPool(), buildJazzHarmonyPool(), buildFingerstylePool());
  pools.push(buildModalVampPool(), buildTriadCompingPool(), buildScaleOverChordPool(), buildGenrePhrasePool());
  return pools.flat();
}

function pickFromPools(names, count){
  const t = getTheoryPools();
  const items = [];
  names.forEach(n=>{ if(t[n]) items.push(...t[n].items); });
  return shuffleArr(items).slice(0,count);
}

function weakReviewItems(count){
  const weak = weakestTopics(8).map(w=>w.topic);
  const all = allQuizPoolsFlat();
  const matched = all.filter(it=>weak.includes(it.topic));
  const pool = matched.length>=count ? matched : all;
  return shuffleArr(pool).slice(0,count);
}

const CHECKPOINTS = [
  {id:'cp1', name:'Foundations Checkpoint', threshold:0.7},
  {id:'cp2', name:'Harmony Checkpoint', threshold:0.72},
  {id:'cp3', name:'Application Checkpoint', threshold:0.75},

];

function buildDurationPlan(minutes){
  if(minutes===30){
    return [
      {type:'quiz', title:'Theory Warm-up', itemsFn:()=>pickFromPools(['alphabet','intervals'],8)},
      {type:'module', title:'Fretboard Sprint', moduleId:'fretboard', note:'Run a 15-note session — favor natural notes if you are early in training.'},
      {type:'module', title:'Ear Trainer', moduleId:'ear', note:'Run a 10-item Notes/Intervals session.'},
      {type:'quiz', title:'Application Review', itemsFn:()=>pickFromPools(['diatonic'],6)},
      {type:'quiz', title:'Cumulative Mini-Review', itemsFn:()=>weakReviewItems(5)},
    ];
  }
  if(minutes===60){
    return [
      {type:'quiz', title:'Theory Warm-up', itemsFn:()=>pickFromPools(['alphabet','intervals','scales'],10)},

      {type:'module', title:'Rhythm Lab', moduleId:'rhythm', note:'Run a subdivision or strumming grid tap-along.'},
      {type:'quiz', title:'Diatonic Harmony Drill', itemsFn:()=>pickFromPools(['diatonic','triads'],8)},

      {type:'quiz', title:'Cumulative Review', itemsFn:()=>weakReviewItems(8)},
    ];
  }
  return [ // 120
    {type:'quiz', title:'Theory Deep Dive', itemsFn:()=>pickFromPools(['alphabet','intervals','scales','degrees'],14)},
    {type:'module', title:'Fretboard Sprint', moduleId:'fretboard', note:'Full chromatic session, 25+ notes across the whole neck.'},
    {type:'module', title:'Ear Trainer', moduleId:'ear', note:'Cover all seven ear-training modes at least once.'},
    {type:'module', title:'Rhythm Lab', moduleId:'rhythm', note:'Run subdivisions, syncopation, and one odd-meter pattern.'},
    {type:'quiz', title:'Harmony Deep Dive', itemsFn:()=>pickFromPools(['diatonic','minorFamily','triads','sevenths'],14)},

function buildRecoveryPlan(){

function buildCramPlan(){
  return [

      {type:'module', title:'Fretboard Sprint', moduleId:'fretboard', note:'Natural notes first, then chromatic.'},
      {type:'quiz', title:'Scales & Circle of Fifths', itemsFn:()=>pickFromPools(['scales','circleOfFifths','caged'],10)},

      {type:'boss', title:'Cram Boss Test', count:16},
    ]},

function buildMultiDayPlan(totalDays){
  const templates = [
    {title:'Theory + Fretboard', segFn:()=>[
      {type:'quiz', title:'Theory Set', itemsFn:()=>pickFromPools(['alphabet','intervals','scales','degrees'],10)},
      {type:'module', title:'Fretboard Sprint', moduleId:'fretboard', note:'15-note session.'},
    ]},
    {title:'Ear + Rhythm', segFn:()=>[
      {type:'module', title:'Ear Trainer', moduleId:'ear', note:'Notes, Intervals, Chords.'},
      {type:'module', title:'Rhythm Lab', moduleId:'rhythm', note:'One tap-along pattern.'},
    ]},
    {title:'Technique + Style', segFn:()=>[
      {type:'module', title:'Technique Gym', moduleId:'technique', note:'Push toward a new tempo ceiling.'},
      {type:'quiz', title:'Style Lane Set', itemsFn:()=>shuffleArr([...buildMetalLeadPool(),...buildJazzHarmonyPool(),...buildFingerstylePool()]).slice(0,8)},
    ]},
    {title:'Application', segFn:()=>[
      {type:'quiz', title:'Application Lab Set', itemsFn:()=>shuffleArr([...buildTriadCompingPool(),...buildScaleOverChordPool(),...buildModalVampPool()]).slice(0,10)},
    ]},
    {title:'Cumulative Review', segFn:()=>[
      {type:'quiz', title:'Weak-Spot Review', itemsFn:()=>weakReviewItems(10)},
    ]},
  ];
  const days = [];
  for(let d=1; d<=totalDays; d++){
    const isBoss = d%5===0;
    const tpl = templates[(d-1)%templates.length];
    const segments = tpl.segFn();
    if(isBoss) segments.push({type:'boss', title:'Checkpoint Boss Test', count:12});
    days.push({day:d, title:`Day ${d} — ${isBoss? 'Checkpoint: '+tpl.title : tpl.title}`, segments, boss:isBoss});
  }
  return days;
}

const DailyEngine = (function(){
  function mount(container){
    container.innerHTML='';
    const wrap = el('div','route-fade');
    wrap.appendChild(el('div','view-head','<div><span class="eyebrow">Module 08</span><h1 class="view-title">Daily Practice Engine</h1><p class="view-sub">Auto-generated, interleaved routines with weak-spot targeting and boss-test checkpoints.</p></div>'));

    const weak = weakestTopics(3);
    if(weak.length){
      const card = el('div','card card-tight');
      card.style.marginBottom='var(--space-5)';
      card.innerHTML = `<span class="eyebrow">Weak-spot targeting active</span><div style="font-size:var(--text-sm)">Today's plan will prioritize: ${weak.map(w=>w.topic).join(', ')}</div>`;
      wrap.appendChild(card);
    }

    const grid = el('div','grid grid-3');
    const routineTiles = [
      {name:'30-Minute Routine', desc:'Quick daily maintenance session.', action:()=>runPlan(container, '30-Minute Routine', buildDurationPlan(30))},
      {name:'60-Minute Routine', desc:'Balanced full-module session.', action:()=>runPlan(container, '60-Minute Routine', buildDurationPlan(60))},
      {name:'120-Minute Routine', desc:'Deep session ending in a boss test.', action:()=>runPlan(container, '120-Minute Routine', buildDurationPlan(120))},
      {name:'Recovery Day', desc:'Lighter load — review only, no new material.', action:()=>runPlan(container, 'Recovery Day', buildRecoveryPlan())},
      {name:'72-Hour Cram Mode', desc:'A focused 3-day plan before a deadline.', action:()=>runMultiDay(container, '72-Hour Cram Mode', buildCramPlan())},
      {name:'14-Day Core Mode', desc:'Two-week structured curriculum.', action:()=>runMultiDay(container, '14-Day Core Mode', buildMultiDayPlan(14))},
      {name:'30-Day Bootcamp Mode', desc:'The full accelerated bootcamp curriculum.', action:()=>runMultiDay(container, '30-Day Bootcamp Mode', buildMultiDayPlan(30))},
      {name:'Boss Test', desc:'Cumulative test pulling your hardest items across every module.', action:()=>runBossOnly(container)},
    ];
    routineTiles.forEach(rt=>{
      const tile = el('button','mod-tile');
      tile.innerHTML = `<h3>${rt.name}</h3><p>${rt.desc}</p><div class="mod-meta"><span>Start →</span><span>&nbsp;</span></div>`;
      tile.addEventListener('click', rt.action);
      grid.appendChild(tile);
    });
    wrap.appendChild(grid);

    if(Object.keys(State.checkpoints).length){
      wrap.appendChild(el('hr','div'));
      const cpWrap = el('div');
      cpWrap.appendChild(el('span','eyebrow','Checkpoints unlocked'));
      const badges = el('div');
      CHECKPOINTS.forEach(cp=>{ if(State.checkpoints[cp.id]) badges.appendChild(el('span','rank-badge',cp.name+' ✓')); });
      cpWrap.appendChild(badges);
      wrap.appendChild(cpWrap);
    }
    container.appendChild(wrap);
  }

  function runPlan(container, title, segments){
    let idx = 0;
    const startXp = State.xp;
    function showStep(){
      container.innerHTML='';
      const wrap = el('div','route-fade drill-shell');
      const back = el('button','btn btn-ghost btn-sm','← Practice engine');
      back.addEventListener('click', ()=>mount(container));
      wrap.appendChild(back);
      const topline = el('div','drill-topline'); topline.style.marginTop='var(--space-4)';
      topline.innerHTML = `<span>${title} — Step ${idx+1} / ${segments.length}</span><span class="combo">${segments[idx].title}</span>`;
      wrap.appendChild(topline);
      const trk = el('div','progress-track'); trk.style.marginBottom='var(--space-5)';
      const f = el('div','progress-fill'); f.style.width = Math.round(100*idx/segments.length)+'%'; trk.appendChild(f);
      wrap.appendChild(trk);
      const host = el('div'); host.id='plan-host';
      wrap.appendChild(host);
      container.appendChild(wrap);
      runSegment(segments[idx], host, next);
    }
    function next(){ idx++; if(idx>=segments.length) finishPlan(); else showStep(); }
    function finishPlan(){
      container.innerHTML='';
      const wrap = el('div','route-fade drill-shell');
      const card = el('div','card'); card.style.textAlign='center';
      card.innerHTML = `<span class="eyebrow">Routine complete</span><h2 class="view-title">${title}</h2><p class="view-sub">You earned <b>${State.xp-startXp} XP</b> this session.</p>`;
      const actions = el('div','drill-actions');
      const home = el('button','btn btn-primary','Back to Practice Engine');
      home.addEventListener('click', ()=>mount(container));
      actions.appendChild(home);
      card.appendChild(actions);
      wrap.appendChild(card);
      container.appendChild(wrap);
    }
    showStep();
  }

  function runSegment(seg, host, onDone){
    host.innerHTML='';
    if(seg.type==='quiz'){
      const items = seg.itemsFn();
      runDrill({ container: host, queue: items, moduleId:'daily', title: seg.title,
        onComplete:(summary)=>renderDrillSummary(host, summary, {title:seg.title, onDone}) });
    } else if(seg.type==='boss'){
      const items = buildBossQueue([{items:allQuizPoolsFlat()}], seg.count);
      runDrill({ container: host, queue: items, moduleId:'boss', title: seg.title,
        onComplete:(summary)=>{
          const passed = summary.accuracy >= 0.7;
          if(passed){
            const nextCp = CHECKPOINTS.find(c=>!State.checkpoints[c.id]);
            if(nextCp) State.checkpoints[nextCp.id] = true;
          }
          const box = el('div');
          renderDrillSummary(box, summary, {title:seg.title, onDone});
          host.innerHTML=''; host.appendChild(box);
          const note = el('div','card card-tight');
          note.style.marginTop='var(--space-4)';
          note.innerHTML = passed? `<b>Checkpoint passed.</b> A new checkpoint badge has been unlocked.` : `<b>Checkpoint not yet passed</b> — review your weakest topics and try another boss test soon.`;
          host.appendChild(note);
        } });
    } else if(seg.type==='module'){
      const card = el('div','card');
      card.innerHTML = `<span class="eyebrow">Live module segment</span><h3 class="view-title" style="font-size:var(--text-lg)">${seg.title}</h3><p class="view-sub" style="margin-bottom:var(--space-4)">${seg.note||''}</p>`;
      const actions = el('div','drill-actions');
      const openBtn = el('button','btn btn-primary','Open '+seg.title);
      openBtn.addEventListener('click', ()=>Router.go(seg.moduleId));
      const doneBtn = el('button','btn btn-ghost','Mark segment done & continue');
      doneBtn.addEventListener('click', onDone);
      actions.appendChild(openBtn); actions.appendChild(doneBtn);
      card.appendChild(actions);
      host.appendChild(card);
    }
  }

  function runMultiDay(container, title, days){
    container.innerHTML='';
    const wrap = el('div','route-fade');
    const back = el('button','btn btn-ghost btn-sm','← Practice engine');
    back.addEventListener('click', ()=>mount(container));
    wrap.appendChild(back);
    wrap.appendChild(el('div','view-head', `<div><span class="eyebrow">Multi-day plan</span><h1 class="view-title">${title}</h1></div>`));
    const list = el('div','checklist');
    if(!State.dailyDaysDone[title]) State.dailyDaysDone[title] = new Set();
    days.forEach(d=>{
      const done = State.dailyDaysDone[title].has(d.day);
      const row = el('div','check-row'+(done?' done':''));
      const cbox = el('span','cbox', done?'✓':'');
      row.appendChild(cbox);
      const label = el('div'); label.style.flex='1';
      label.innerHTML = `<b>${d.title}</b>${d.boss?' <span class="tag on">Boss test</span>':''}`;
      row.appendChild(label);
      const startBtn = el('button','btn btn-sm btn-ghost','Start');
      startBtn.addEventListener('click', ()=>{
        runPlan(container, d.title, d.segments);
        State.dailyDaysDone[title].add(d.day);
      });
      row.appendChild(startBtn);
      list.appendChild(row);
    });
    wrap.appendChild(list);
    container.appendChild(wrap);
  }

  function runBossOnly(container){
    container.innerHTML='';
    const wrap = el('div','route-fade drill-shell');
    const back = el('button','btn btn-ghost btn-sm','← Practice engine');
    back.addEventListener('click', ()=>mount(container));
    wrap.appendChild(back);
    wrap.appendChild(el('div','view-head', `<div><span class="eyebrow">Cumulative review</span><h1 class="view-title">Boss Test</h1></div>`));
    const host = el('div'); host.id='boss-host';
    wrap.appendChild(host);
    container.appendChild(wrap);
    runSegment({type:'boss', title:'Boss Test', count:16}, host, ()=>mount(container));
  }

  return { mount };
})();

  function go(viewId){
    if(!VIEWS[viewId]) viewId='home';
    current = viewId;
    renderNav();
    const main = document.getElementById('main');
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
    VIEWS[viewId](main);
    main.focus({preventScroll:true});
  }
  function renderNav(){
    const nav = document.getElementById('navbar');
    nav.innerHTML = '';
    NAV_ITEMS.forEach(item=>{
      const btn = el('button','nav-btn'+(current===item.id?' active':''));
      btn.innerHTML = `${NAV_ICONS[item.id]}<span>${item.label}</span>`;
      btn.setAttribute('aria-current', current===item.id ? 'page':'false');
      btn.addEventListener('click', ()=>go(item.id));
      nav.appendChild(btn);
    });
  }
  return { go, renderNav, get current(){ return current; } };
})();

function launchTheory(container, topic){

(function(){
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9" stroke-linecap="round"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke-linejoin="round"/></svg>';

  function applyTheme(theme){
    State.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('theme-toggle');
    if(btn){
      btn.innerHTML = theme==='light' ? MOON_ICON : SUN_ICON;
      btn.setAttribute('aria-label', theme==='light' ? 'Switch to dark mode' : 'Switch to light mode');
    }
  }

  function toggleTheme(){
    applyTheme(State.theme==='light' ? 'dark' : 'light');
  }

  function showHelp(){
    const root = document.getElementById('overlay-root');
    root.innerHTML='';
    const overlay = el('div','overlay');
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) root.innerHTML=''; });
    const sheet = el('div','sheet');

        <p><b>Retrieval first.</b> Every drill asks you to answer before revealing anything — that's what builds real recall.</p>
        <p><b>Spaced repetition.</b> Missed items resurface sooner; mastered items resurface later. Progress is tracked per item across an in-session virtual clock.</p>
        <p><b>Interleaving.</b> Theory, fretboard, ear, rhythm, and technique are deliberately mixed rather than blocked, which research shows improves long-term retention.</p>
        <p><b>Tempo gating.</b> In Technique Gym, BPM only increases after you hit a clean-rep streak at the current tempo.</p>
        <p><b>Daily Practice Engine.</b> Auto-builds a session from your weakest topics — from a 30-minute routine to a full 30-day bootcamp curriculum, with boss tests unlocking checkpoints.</p>
        <p style="color:var(--muted)">Keyboard: number keys select multiple-choice answers, Enter confirms/advances a typed answer or moves to the next item.</p>
      </div>
      <div class="drill-actions" style="margin-top:var(--space-5)"><button class="btn btn-primary" id="help-close">Got it</button></div>
    `;
    overlay.appendChild(sheet);
    root.appendChild(overlay);
    document.getElementById('help-close').addEventListener('click', ()=>{ root.innerHTML=''; });
  }

  function boot(){
    applyTheme('light');
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('btn-help').addEventListener('click', showHelp);
    document.addEventListener('keydown', (e)=>{
      if(e.key==='?' ) showHelp();
      if(e.key==='Escape'){ document.getElementById('overlay-root').innerHTML=''; }
    });
    getTheoryPools(); // warm the theory pool cache
    Router.go('home');
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://perplexity.localhost","http://localhost:1420","http://127.0.0.1:1420","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();
